<div class="relative px-3 md:px-6  flex items-center justify-center">
  <!-- Header -->
  <div class="w-full max-w-md">
    <div class="text-center mb-8">
      <h1 class="text-3xl md:text-5xl font-bold mb-3 md:mb-4 bg-gradient-to-r from-spotify-green via-green-400 to-blue-500 bg-clip-text text-transparent">
        Inscription
      </h1>
      <p class="text-gray-400 text-base md:text-lg">Rejoignez MusicStreams aujourd'hui</p>
    </div>

    <!-- Form -->
    <form [formGroup]="registerForm" (ngSubmit)="onSubmit()" 
          class="bg-black/40 backdrop-blur-xl rounded-2xl md:rounded-3xl p-6 md:p-8 shadow-2xl border border-white/5">
      
      <!-- Username -->
      <div class="mb-6 group">
        <label class="inline-flex items-center space-x-2 text-gray-300 text-sm font-medium mb-2 group-hover:text-spotify-green transition-colors">
          <mat-icon class="text-gray-400 group-hover:text-spotify-green transition-colors">person</mat-icon>
          <span>Nom d'utilisateur</span>
        </label>
        <input formControlName="username" 
               type="text"
               class="w-full bg-white/5 text-white px-4 py-4 rounded-xl focus:outline-none focus:ring-2 focus:ring-spotify-green border-0 placeholder-gray-500 transition-all hover:bg-white/10"
               [ngClass]="{'ring-2 ring-red-500': usernameControl?.invalid && usernameControl?.touched}"
               placeholder="Entrez votre nom d'utilisateur" />
        <div class="mt-1 text-sm" *ngIf="usernameControl?.touched">
          <p class="text-red-500" *ngIf="usernameControl?.errors?.['required']">Le nom d'utilisateur est requis</p>
          <p class="text-red-500" *ngIf="usernameControl?.errors?.['minlength']">Le nom d'utilisateur doit contenir au moins 3 caractères</p>
        </div>
      </div>

      <!-- Password -->
      <div class="mb-6 group">
        <label class="inline-flex items-center space-x-2 text-gray-300 text-sm font-medium mb-2 group-hover:text-spotify-green transition-colors">
          <mat-icon class="text-gray-400 group-hover:text-spotify-green transition-colors">lock</mat-icon>
          <span>Mot de passe</span>
        </label>
        <div class="relative">
          <input formControlName="password" 
                 [type]="showPassword ? 'text' : 'password'"
                 class="w-full bg-white/5 text-white px-4 py-4 rounded-xl focus:outline-none focus:ring-2 focus:ring-spotify-green border-0 placeholder-gray-500 transition-all hover:bg-white/10"
                 [ngClass]="{'ring-2 ring-red-500': passwordControl?.invalid && passwordControl?.touched}"
                 placeholder="Entrez votre mot de passe" />
          <button type="button" 
                  (click)="togglePasswordVisibility()"
                  class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-400 hover:text-spotify-green transition-colors">
            <mat-icon>{{ showPassword ? 'visibility_off' : 'visibility' }}</mat-icon>
          </button>
        </div>
        <div class="mt-1 text-sm" *ngIf="passwordControl?.touched">
          <p class="text-red-500" *ngIf="passwordControl?.errors?.['required']">Le mot de passe est requis</p>
          <p class="text-red-500" *ngIf="passwordControl?.errors?.['minlength']">Le mot de passe doit contenir au moins 6 caractères</p>
        </div>
      </div>

      <!-- Role Selection -->
      <div class="mb-8 group">
        <label class="inline-flex items-center space-x-2 text-gray-300 text-sm font-medium mb-2 group-hover:text-spotify-green transition-colors">
          <mat-icon class="text-gray-400 group-hover:text-spotify-green transition-colors">admin_panel_settings</mat-icon>
          <span>Rôle</span>
        </label>
        <div class="grid grid-cols-2 gap-4">
          <label class="flex items-center justify-center p-4 rounded-xl bg-white/5 hover:bg-white/10 cursor-pointer transition-all"
                 [class.ring-2]="registerForm.get('role')?.value === 'client'"
                 [class.ring-spotify-green]="registerForm.get('role')?.value === 'client'">
            <input type="radio" 
                   formControlName="role" 
                   value="client" 
                   class="hidden" />
            <span class="text-white">Client</span>
          </label>
          <label class="flex items-center justify-center p-4 rounded-xl bg-white/5 hover:bg-white/10 cursor-pointer transition-all"
                 [class.ring-2]="registerForm.get('role')?.value === 'admin'"
                 [class.ring-spotify-green]="registerForm.get('role')?.value === 'admin'">
            <input type="radio" 
                   formControlName="role" 
                   value="admin" 
                   class="hidden" />
            <span class="text-white">Admin</span>
          </label>
        </div>
      </div>

      <!-- Submit Button -->
      <button type="submit" 
              [disabled]="!registerForm.valid"
              class="w-full bg-gradient-to-r from-spotify-green to-green-500 hover:from-spotify-green-hover hover:to-green-400 text-white font-bold py-4 rounded-xl transition-all duration-300 transform hover:scale-[1.02] disabled:opacity-50 disabled:hover:scale-100 disabled:cursor-not-allowed">
        <span class="flex items-center justify-center space-x-2">
          <mat-icon>how_to_reg</mat-icon>
          <span>S'inscrire</span>
        </span>
      </button>
    </form>
  </div>
</div>
