
<div class="flex justify-between items-center mb-8">
  <h2 class="text-2xl md:text-4xl font-extrabold text-spotify-green">Ma Bibliothèque</h2>
  
  <button *ngIf="isAdmin$ | async"
          [routerLink]="['/add-track']"
          class="bg-spotify-green text-black px-4 py-2 rounded-md hover:bg-green-400 transition-colors">
    Ajouter une chanson
  </button>
</div>

<div class="flex flex-col md:flex-row gap-4 mb-8">
  <div class="flex px-3 md:px-4 py-2 md:py-3 border-b border-green-400 focus-within:border-green-500 overflow-hidden max-w-full md:max-w-md font-[sans-serif]">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192.904 192.904" width="18px" class="fill-green-600 mr-3">
      <path
        d="m190.707 180.101-47.078-47.077c11.702-14.072 18.752-32.142 18.752-51.831C162.381 36.423 125.959 0 81.191 0 36.422 0 0 36.423 0 81.193c0 44.767 36.422 81.187 81.191 81.187 19.688 0 37.759-7.049 51.831-18.751l47.079 47.078a7.474 7.474 0 0 0 5.303 2.197 7.498 7.498 0 0 0 5.303-12.803zM15 81.193C15 44.694 44.693 15 81.191 15c36.497 0 66.189 29.694 66.189 66.193 0 36.496-29.692 66.187-66.189 66.187C44.693 147.38 15 117.689 15 81.193z">
      </path>
    </svg>
    <input 
      type="text" 
      placeholder="chercher..." 
      class="w-full bg-inherit text-gray-300 outline-none"
      (input)="onSearchChange($event)"
    />
  </div>


  

</div>
<div 
(click)="onCategoryChange($any($event.target).value)">
<button class="bg-spotify-green m-2 text-black px-4 py-2 rounded-md" value="all">Toutes les catégories</button>
<button class="bg-spotify-green m-2 text-black px-4 py-2 rounded-md" value="pop">Pop</button>
<button class="bg-spotify-green m-2 text-black px-4 py-2 rounded-md" value="rock">Rock</button>
<button class="bg-spotify-green m-2 text-black px-4 py-2 rounded-md" value="rap">Rap</button>
<button class="bg-spotify-green m-2 text-black px-4 py-2 rounded-md" value="cha3bi">Chaabi</button>
<button class="bg-spotify-green m-2 text-black px-4 py-2 rounded-md" value="jazz">Jazz</button>
<button class="bg-spotify-green m-2 text-black px-4 py-2 rounded-md" value="classique">Classique</button>
<button class="bg-spotify-green m-2 text-black px-4 py-2 rounded-md" value="rai">Raï</button>
<button class="bg-spotify-green m-2 text-black px-4 py-2 rounded-md" value="other">Autre</button>
</div>

<div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4 md:gap-8 mt-8 md:mt-16">
  <app-track-card
    *ngFor="let song of (songs$ | async)"
    [track]="{
      id: song.id,
      title: song.titre,
      artist: song.artiste,
      duration: song.duree,
      coverUrl: song.coverFileId ? environment.apiUrl + '/api/admin/songs/' + song.id + '/cover' : 'assets/default-cover.png',
      audioUrl: song.audioFileId ? environment.apiUrl + '/api/admin/songs/' + song.id + '/audio' : '',
      category: song.categorie
    }"
    (deleteTrack)="confirmDelete($event)"
  ></app-track-card>
</div>
